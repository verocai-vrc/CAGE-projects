name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # Loop 6.12: DESIGN.md §15.9's budgets, measured from the build above
      # rather than estimated. Budgets erode one reasonable addition at a time,
      # so this runs on every push, not once at the end of a milestone.
      - run: npm run budget
